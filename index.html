<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#04080f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- SEO / OG -->
    <title>Kalshi Bot — Prediction Markets</title>
    <meta name="description" content="Trade YES or NO on crypto, stocks, politics and sports. Real prices. Instant payouts. Create custom markets on anything." />
    <meta property="og:title" content="Kalshi Bot — Prediction Markets" />
    <meta property="og:description" content="Trade YES or NO on crypto, stocks, politics and sports. Real prices. Instant payouts." />
    <meta property="og:type" content="website" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // SPA route restore for GitHub Pages 404 redirect
      (function () {
        var params = new URLSearchParams(window.location.search);
        var spa = params.get('spa');
        if (spa) {
          history.replaceState(null, '', '/kalshi-bot' + spa);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
